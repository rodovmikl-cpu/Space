<html lang="en">
  <head>
    <title>space online</title>
  </head>
  <body>
    <h1>space</h1>
    <style>
      h1{
        font-size:100px;
         background-size: cover;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
        background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS44dsox_SOFWcPhpd3OQcheTp9hAmc1IPL-XcTHbLxtg&s=10");

      }
      @keyframes space{

        }
        33%{
          transform.translateY(50px);
        }
      }
    </style>
    <style>
      body{
        background-color:black;
      }
