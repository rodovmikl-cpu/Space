<!DOCTYPE html>
<html lang="en">
  <head>
    <title>space online</title>
  </head>
  <body>
    <h1>space</h1>
    <style>
      h1{
        font-size:100px;
         background-size: cover;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
        background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS44dsox_SOFWcPhpd3OQcheTp9hAmc1IPL-XcTHbLxtg&s=10");
    animation:space 5s infinite;
        display:inline-block;
      }
      @keyframes space{

    0%{

        transform:translateY(0);

    }

    50%{

        transform:translateY(100px);

    }

    100%{
        transform:translateY(0);
    }
}
    </style>
    <style>
      body{
        background-color:black;
      }
    </style>
    <input type="text" id="login"
       placeholder="login here"/><button onclick="login()">click</button>
    <style>
      input{
        margin-top:100px;
        font-size:30px; 
        background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXXhFsTHeIarBzfMJZ0zRLT3-wWGsQT_7lak86qYH1r0x06PV_BcKaf9P0&s=10");
        background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS44dsox_SOFWcPhpd3OQcheTp9hAmc1IPL-XcTHbLxtg&s=10");
        border-radius:999px;
        border:5px solid white;
      }
      ::placeholder{
        color:black;
      }
      button{
        font-size:50px;
        background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXXhFsTHeIarBzfMJZ0zRLT3-wWGsQT_7lak86qYH1r0x06PV_BcKaf9P0&s=10");
        margin-left:50px;
        border-radius:999px;
        color:black;
        border:5px solid white;
      }
    </style>
    <script>
      function login(){
    let login = document.getElementById("login").value;
      localStorage.setItem("login",login);
    alert("hello");
      }
